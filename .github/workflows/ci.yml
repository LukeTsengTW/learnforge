name: LearnForge CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Verify exact Node and npm versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
        env:
          VITE_TURNSTILE_SITE_KEY: ''
      - run: npm run check:quizzes
      - run: npm run check:ai-context
      - run: npm run check:edge-imports
      - run: npm run build
      - run: npm audit --omit=dev
